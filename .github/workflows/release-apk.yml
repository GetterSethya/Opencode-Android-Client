name: Release APK

# Cut a release by tagging a commit on main:
#   git tag release-v1.0.0 main && git push origin release-v1.0.0
# Pushing the tag builds a standalone arm64 APK and publishes it as a
# GitHub Release asset. The release package id (com.opencode.expo.release)
# differs from the dev-client build, so both install side by side.
#
# The APK is signed with the debug keystore (same as local release builds):
# fine for personal sideloading, not for Play distribution.
on:
  push:
    tags:
      - 'release-*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the APK
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release notes can list the commits since the
          # previous release tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action's default `packages` is "tools platform-tools", but the
      # legacy `tools` package no longer exists in the SDK repository, so
      # sdkmanager fails. Only ask for platform-tools; the actual build
      # platforms are installed in the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null

      - name: Derive app version from tag
        id: appversion
        run: |
          version="${GITHUB_REF_NAME#release-v}"
          if ! grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?' <<<"$version"; then
            echo "::error::Tag $GITHUB_REF_NAME must look like release-v1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild (release variant)
        run: npx expo prebuild --platform android
        env:
          CI: true
          APP_VARIANT: release
          APP_VERSION: ${{ steps.appversion.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
          EXPO_PUBLIC_APP_VERSION: ${{ steps.appversion.outputs.version }}
          EXPO_PUBLIC_APP_VERSION_CODE: ${{ github.run_number }}
          EXPO_PUBLIC_OPENCODE_URL: ${{ vars.EXPO_PUBLIC_OPENCODE_URL }}

      # The local config plugin pins low-memory Gradle settings
      # (parallel=false, -Xmx1024m, workers.max=2) for the 4-core / 11GiB dev
      # machine. CI runners have headroom, so restore full parallelism here —
      # this must run after prebuild, which regenerates android/gradle.properties.
      - name: Restore full-parallel Gradle settings for CI
        run: |
          f=android/gradle.properties
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' "$f"
          sed -i 's/^org\.gradle\.parallel=.*/org.gradle.parallel=true/' "$f"
          sed -i 's/^org\.gradle\.workers\.max=.*/org.gradle.workers.max=4/' "$f"
          grep -E '^(org\.gradle\.jvmargs|org\.gradle\.parallel|org\.gradle\.workers\.max)=' "$f"

      - name: Assemble release APK (arm64-v8a)
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --console=plain
        working-directory: android
        env:
          # Metro inlines EXPO_PUBLIC_* when the JS bundle is built, which
          # happens here (not during prebuild), so these must be set for this
          # step or the installed app reports the "dev" fallback.
          APP_VARIANT: release
          EXPO_PUBLIC_APP_VERSION: ${{ steps.appversion.outputs.version }}
          EXPO_PUBLIC_APP_VERSION_CODE: ${{ github.run_number }}
          EXPO_PUBLIC_OPENCODE_URL: ${{ vars.EXPO_PUBLIC_OPENCODE_URL }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "opencode-${{ github.ref_name }}-arm64-v8a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: opencode-*.apk

      - name: Compose release notes
        run: |
          previous=$(git tag -l 'release-*' --sort=v:refname | grep -vx "$GITHUB_REF_NAME" | tail -1)
          if [ -z "$previous" ]; then
            range="$GITHUB_REF_NAME"
          else
            range="${previous}..${GITHUB_REF_NAME}"
          fi
          {
            echo "## What changed"
            echo
            git log --no-merges --pretty='- %s' "$range"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        run: >
          gh release create "${{ github.ref_name }}"
          "opencode-${{ github.ref_name }}-arm64-v8a.apk"
          --title "${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
