appId: com.opencode.expo
---
# Full path: menu -> Model -> Manage -> providers -> back -> must be gone
- extendedWaitUntil:
    visible: "Session options"
    timeout: 60000
- tapOn: "Session options"
- extendedWaitUntil:
    visible: "Model"
    timeout: 60000
- tapOn: "Model"
- extendedWaitUntil:
    visible: "Select model"
    timeout: 60000
- tapOn: "Manage"
- extendedWaitUntil:
    visible: "Models & providers"
    timeout: 60000
- back
- extendedWaitUntil:
    notVisible: "Models & providers"
    timeout: 60000
- assertNotVisible: "Select model"
